name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.0.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Orion-RE-Windows.slnx

      - name: Test
        run: dotnet test Orion-RE-Windows.slnx --configuration Release

      - name: Publish standalone x64 executable
        run: dotnet publish Orion.Windows/Orion.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:AssemblyName=Orion-RE --output artifacts/publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" artifacts/publish/Orion-RE.exe --repo "${{ github.repository }}" --title "Orion-RE Windows ${{ inputs.tag }}" --generate-notes
