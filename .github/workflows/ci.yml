name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Orion-RE-Windows.slnx

      - name: Build
        run: dotnet build Orion-RE-Windows.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Orion-RE-Windows.slnx --configuration Release --no-build --verbosity minimal
